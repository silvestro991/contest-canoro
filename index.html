<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contest Canoro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f7;
            color: #222;
        }

        .contenitore {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .intestazione {
            text-align: center;
            margin-bottom: 20px;
        }

        .intestazione h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .intestazione p {
            margin: 0;
            color: #666;
        }

        .manche {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .manche button {
            flex: 1;
            border: 2px solid #ddd;
            background: white;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .manche button.attiva {
            background: #222;
            color: white;
            border-color: #222;
        }

        .concorrente {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .concorrente h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 18px;
        }

        .voti {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .voto {
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            padding: 12px 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .voto:hover {
            background: #eee;
        }

        .voto.selezionato {
            background: #222;
            color: white;
            border-color: #222;
        }

        .invia {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: white;
            margin-top: 10px;
        }

        .invia:disabled {
            background: #bbb;
            cursor: not-allowed;
        }

        .messaggio {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.4;
        }

        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="contenitore">

    <div class="intestazione">
        <h1>🎤 Contest Canoro</h1>
        <p id="sottotitolo">Votazione</p>
    </div>

    <!-- SELEZIONE MANCHE -->
    <div class="manche">
        <button id="manche1" class="attiva">
            Manche 1
        </button>

        <button id="manche2">
            Manche 2
        </button>
    </div>


    <!-- CONCORRENTE 1 -->
    <div class="concorrente" data-id="concorrente1">

        <h2 id="nome1">Concorrente 1</h2>

        <div class="voti">

            <button class="voto" data-voto="1">1</button>
            <button class="voto" data-voto="1.5">1,5</button>
            <button class="voto" data-voto="2">2</button>
            <button class="voto" data-voto="2.5">2,5</button>
            <button class="voto" data-voto="3">3</button>
            <button class="voto" data-voto="3.5">3,5</button>
            <button class="voto" data-voto="4">4</button>
            <button class="voto" data-voto="4.5">4,5</button>
            <button class="voto" data-voto="5">5</button>

        </div>
    </div>


    <!-- CONCORRENTE 2 -->
    <div class="concorrente" data-id="concorrente2">

        <h2 id="nome2">Concorrente 2</h2>

        <div class="voti">

            <button class="voto" data-voto="1">1</button>
            <button class="voto" data-voto="1.5">1,5</button>
            <button class="voto" data-voto="2">2</button>
            <button class="voto" data-voto="2.5">2,5</button>
            <button class="voto" data-voto="3">3</button>
            <button class="voto" data-voto="3.5">3,5</button>
            <button class="voto" data-voto="4">4</button>
            <button class="voto" data-voto="4.5">4,5</button>
            <button class="voto" data-voto="5">5</button>

        </div>
    </div>


    <!-- CONCORRENTE 3 -->
    <div class="concorrente" data-id="concorrente3">

        <h2 id="nome3">Concorrente 3</h2>

        <div class="voti">

            <button class="voto" data-voto="1">1</button>
            <button class="voto" data-voto="1.5">1,5</button>
            <button class="voto" data-voto="2">2</button>
            <button class="voto" data-voto="2.5">2,5</button>
            <button class="voto" data-voto="3">3</button>
            <button class="voto" data-voto="3.5">3,5</button>
            <button class="voto" data-voto="4">4</button>
            <button class="voto" data-voto="4.5">4,5</button>
            <button class="voto" data-voto="5">5</button>

        </div>
    </div>


    <button class="invia" id="invia" disabled>
        INVIA VOTAZIONE
    </button>

    <div class="messaggio" id="messaggio"></div>

    <div class="info">
        Puoi votare una sola volta per ogni manche.
    </div>

</div>


<!-- FIREBASE -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        runTransaction,
        get,
        update
    }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

    import {
        getAuth,
        signInAnonymously
    }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


    // =====================================================
    // CONFIGURAZIONE DELLA SERATA
    // =====================================================

    const SESSIONE = "serata_001";

    /*
       Per cambiare manche:

       "manche1" = prima manche
       "manche2" = seconda manche
    */

    let MANCHE_ATTIVA = "manche1";


    // NOMI DEI CONCORRENTI
    // Per ora li cambiamo qui.
    // In seguito creeremo la pagina amministratore.

    const NOMI = {
        concorrente1: "Concorrente 1",
        concorrente2: "Concorrente 2",
        concorrente3: "Concorrente 3"
    };


    // =====================================================
    // CONFIGURAZIONE FIREBASE
    // =====================================================

    const firebaseConfig = {

        apiKey: "AIzaSyBTa5CNVCbVVmFv7auY4EpLiDhS6-M5t-s",

        authDomain: "freeda-voice.firebaseapp.com",

        databaseURL:
            "https://freeda-voice-default-rtdb.europe-west1.firebasedatabase.app",

        projectId: "freeda-voice",

        storageBucket:
            "freeda-voice.firebasestorage.app",

        messagingSenderId: "414855280264",

        appId:
            "1:414855280264:web:bb506f3f9d7fa3f93ad13d"
    };


    // =====================================================
    // AVVIO FIREBASE
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const auth = getAuth(app);


    // =====================================================
    // AUTENTICAZIONE ANONIMA
    // =====================================================

    await signInAnonymously(auth);


    const utente = auth.currentUser;

    if (!utente) {

        throw new Error(
            "Impossibile identificare il votante."
        );
    }


    const ID_UTENTE = utente.uid;


    // =====================================================
    // ELEMENTI PAGINA
    // =====================================================

    const concorrenti =
        document.querySelectorAll(".concorrente");

    const pulsanteInvia =
        document.getElementById("invia");

    const messaggio =
        document.getElementById("messaggio");

    const pulsanteManche1 =
        document.getElementById("manche1");

    const pulsanteManche2 =
        document.getElementById("manche2");


    // Inserimento nomi

    document.getElementById("nome1").textContent =
        NOMI.concorrente1;

    document.getElementById("nome2").textContent =
        NOMI.concorrente2;

    document.getElementById("nome3").textContent =
        NOMI.concorrente3;


    // =====================================================
    // CAMBIO MANCHE
    // =====================================================

    pulsanteManche1.addEventListener("click", async () => {

        await cambiaManche("manche1");

    });


    pulsanteManche2.addEventListener("click", async () => {

        await cambiaManche("manche2");

    });


    async function cambiaManche(manche) {

        MANCHE_ATTIVA = manche;

        pulsanteManche1.classList.remove("attiva");
        pulsanteManche2.classList.remove("attiva");

        if (manche === "manche1") {

            pulsanteManche1.classList.add("attiva");

        } else {

            pulsanteManche2.classList.add("attiva");

        }


        // Cancella eventuali selezioni precedenti

        concorrenti.forEach((concorrente) => {

            concorrente
                .querySelectorAll(".voto")
                .forEach((pulsante) => {

                    pulsante.classList.remove("selezionato");

                });

        });


        pulsanteInvia.disabled = false;

        await controllaSeHaGiaVotato();

    }


    // =====================================================
    // SELEZIONE DEI VOTI
    // =====================================================

    concorrenti.forEach((concorrente) => {

        const pulsanti =
            concorrente.querySelectorAll(".voto");


        pulsanti.forEach((pulsante) => {

            pulsante.addEventListener("click", () => {

                pulsanti.forEach((p) => {

                    p.classList.remove("selezionato");

                });


                pulsante.classList.add("selezionato");


                controllaVotazione();

            });

        });

    });


    // =====================================================
    // CONTROLLA CHE TUTTI ABBIANO UN VOTO
    // =====================================================

    function controllaVotazione() {

        let completati = 0;


        concorrenti.forEach((concorrente) => {

            const selezionato =
                concorrente.querySelector(
                    ".voto.selezionato"
                );


            if (selezionato) {

                completati++;

            }

        });


        pulsanteInvia.disabled =
            completati !== 3;

    }


    // =====================================================
    // CONTROLLA SE L'UTENTE HA GIÀ VOTATO
    // =====================================================

    async function controllaSeHaGiaVotato() {

        const riferimento =
            ref(
                database,
                "serate/" +
                SESSIONE +
                "/" +
                MANCHE_ATTIVA +
                "/votanti/" +
                ID_UTENTE
            );


        const risultato =
            await get(riferimento);


        if (risultato.exists()) {

            pulsanteInvia.disabled = true;

            messaggio.textContent =
                "⚠️ Hai già votato questa manche.";

        } else {

            messaggio.textContent =
                "";

            controllaVotazione();

        }

    }


    // Controlliamo subito la manche iniziale

    await controllaSeHaGiaVotato();


    // =====================================================
    // INVIO DELLA VOTAZIONE
    // =====================================================

    pulsanteInvia.addEventListener(
    "click",
    async () => {

        pulsanteInvia.disabled = true;
        messaggio.textContent = "⏳ Invio dei voti...";

        try {

            const voti = {};

            // Recupera i tre voti
            for (const concorrente of concorrenti) {

                const id = concorrente.dataset.id;

                const selezionato =
                    concorrente.querySelector(".voto.selezionato");

                if (!selezionato) {
                    throw new Error("Manca un voto.");
                }

                voti[id] = Number(selezionato.dataset.voto);
            }


            // Percorso della manche corrente
            const basePath =
                "serate/" +
                SESSIONE +
                "/" +
                MANCHE_ATTIVA;


            // Percorso del votante
            const votantePath =
                basePath +
                "/votanti/" +
                ID_UTENTE;


            // Controllo definitivo prima dell'invio
            const riferimentoVotante =
                ref(database, votantePath);

            const controllo =
                await get(riferimentoVotante);


            if (controllo.exists()) {

                messaggio.textContent =
                    "⚠️ Hai già votato questa manche.";

                return;
            }


            // Aggiorniamo i tre totali
            for (const id in voti) {

                const riferimentoTotale =
                    ref(
                        database,
                        basePath +
                        "/concorrenti/" +
                        id +
                        "/totale"
                    );


                await runTransaction(
                    riferimentoTotale,
                    (totaleAttuale) => {

                        if (totaleAttuale === null) {
                            return voti[id];
                        }

                        return (
                            Number(totaleAttuale) +
                            voti[id]
                        );

                    }
                );

            }


            // Registriamo il votante
            await update(
                riferimentoVotante,
                {
                    votato: true,
                    timestamp: Date.now()
                }
            );


            // Messaggio di conferma
            messaggio.textContent =
                "✅ Votazione registrata! Grazie.";


            // Disabilita tutti i voti
            concorrenti.forEach(
                (concorrente) => {

                    concorrente
                        .querySelectorAll(".voto")
                        .forEach(
                            (pulsante) => {
                                pulsante.disabled = true;
                            }
                        );

                }
            );


        } catch (errore) {

            console.error(errore);

            messaggio.textContent =
                "❌ Errore durante l'invio dei voti.";

            pulsanteInvia.disabled = false;

        }

    }
);
</script>

</body>
</html>
