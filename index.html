<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contest Canoro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f7;
            color: #222;
        }

        .contenitore {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .intestazione {
            text-align: center;
            margin-bottom: 25px;
        }

        .intestazione h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .intestazione p {
            margin: 0;
            color: #666;
        }

        .concorrente {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .concorrente h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 18px;
        }

        .voti {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .voto {
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            padding: 12px 4px;
            font-size: 15px;
            cursor: pointer;
        }

        .voto:hover {
            background: #eee;
        }

        .voto.selezionato {
            background: #222;
            color: white;
            border-color: #222;
        }

        .invia {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: white;
            margin-top: 10px;
        }

        .invia:disabled {
            background: #bbb;
            cursor: not-allowed;
        }

        .messaggio {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="contenitore">

    <div class="intestazione">
        <h1>🎤 Contest Canoro</h1>
        <p>Assegna un voto da 1 a 5 a ciascun concorrente</p>
    </div>

    <!-- CONCORRENTE 1 -->
    <div class="concorrente" data-id="concorrente1">
        <h2>Concorrente 1</h2>

        <div class="voti">
            <button class="voto" data-voto="1">1</button>
            <button class="voto" data-voto="1.5">1,5</button>
            <button class="voto" data-voto="2">2</button>
            <button class="voto" data-voto="2.5">2,5</button>
            <button class="voto" data-voto="3">3</button>
            <button class="voto" data-voto="3.5">3,5</button>
            <button class="voto" data-voto="4">4</button>
            <button class="voto" data-voto="4.5">4,5</button>
            <button class="voto" data-voto="5">5</button>
        </div>
    </div>

    <!-- CONCORRENTE 2 -->
    <div class="concorrente" data-id="concorrente2">
        <h2>Concorrente 2</h2>

        <div class="voti">
            <button class="voto" data-voto="1">1</button>
            <button class="voto" data-voto="1.5">1,5</button>
            <button class="voto" data-voto="2">2</button>
            <button class="voto" data-voto="2.5">2,5</button>
            <button class="voto" data-voto="3">3</button>
            <button class="voto" data-voto="3.5">3,5</button>
            <button class="voto" data-voto="4">4</button>
            <button class="voto" data-voto="4.5">4,5</button>
            <button class="voto" data-voto="5">5</button>
        </div>
    </div>

    <!-- CONCORRENTE 3 -->
    <div class="concorrente" data-id="concorrente3">
        <h2>Concorrente 3</h2>

        <div class="voti">
            <button class="voto" data-voto="1">1</button>
            <button class="voto" data-voto="1.5">1,5</button>
            <button class="voto" data-voto="2">2</button>
            <button class="voto" data-voto="2.5">2,5</button>
            <button class="voto" data-voto="3">3</button>
            <button class="voto" data-voto="3.5">3,5</button>
            <button class="voto" data-voto="4">4</button>
            <button class="voto" data-voto="4.5">4,5</button>
            <button class="voto" data-voto="5">5</button>
        </div>
    </div>

    <button class="invia" id="invia" disabled>
        INVIA VOTAZIONE
    </button>

    <div class="messaggio" id="messaggio"></div>

</div>


<!-- FIREBASE -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        runTransaction
    }
        from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    // CONFIGURAZIONE FIREBASE

    const firebaseConfig = {
        apiKey: "AIzaSyBTa5CNVCbVVmFv7auY4EpLiDhS6-M5t-s",
        authDomain: "freeda-voice.firebaseapp.com",
        databaseURL: "https://freeda-voice-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "freeda-voice",
        storageBucket: "freeda-voice.firebasestorage.app",
        messagingSenderId: "414855280264",
        appId: "1:414855280264:web:bb506f3f9d7fa3f93ad13d"
    };


    // AVVIA FIREBASE

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // GESTIONE DEI VOTI

    const concorrenti = document.querySelectorAll(".concorrente");
    const pulsanteInvia = document.getElementById("invia");
    const messaggio = document.getElementById("messaggio");


    concorrenti.forEach((concorrente) => {

        const pulsanti = concorrente.querySelectorAll(".voto");

        pulsanti.forEach((pulsante) => {

            pulsante.addEventListener("click", () => {

                pulsanti.forEach((p) => {
                    p.classList.remove("selezionato");
                });

                pulsante.classList.add("selezionato");

                controllaVotazione();
            });

        });

    });


    // CONTROLLA CHE TUTTI E 3 ABBIANO UN VOTO

    function controllaVotazione() {

        let completati = 0;

        concorrenti.forEach((concorrente) => {

            const selezionato =
                concorrente.querySelector(".voto.selezionato");

            if (selezionato) {
                completati++;
            }

        });

        pulsanteInvia.disabled = completati !== 3;
    }


    // INVIO DELLA SCHEDA

    pulsanteInvia.addEventListener("click", async () => {

        pulsanteInvia.disabled = true;

        messaggio.textContent = "⏳ Invio dei voti...";


        try {

            for (const concorrente of concorrenti) {

                const id = concorrente.dataset.id;

                const selezionato =
                    concorrente.querySelector(".voto.selezionato");

                const voto =
                    Number(selezionato.dataset.voto);


                const riferimento =
                    ref(database, "serata/concorrenti/" + id + "/totale");


                await runTransaction(
                    riferimento,
                    (totaleAttuale) => {

                        if (totaleAttuale === null) {
                            return voto;
                        }

                        return Number(totaleAttuale) + voto;
                    }
                );

            }


            messaggio.textContent =
                "✅ Votazione registrata! Grazie.";


        } catch (errore) {

            console.error(errore);

            messaggio.textContent =
                "❌ Errore durante l'invio dei voti.";

            pulsanteInvia.disabled = false;
        }

    });

</script>

</body>
</html>
